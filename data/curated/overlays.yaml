# MetroMitra curated overlays (applied after normalisation, before the conflict
# check). M3: interchange merges and name resolutions, each verified against a cited reference. Nothing else is invented. Every entry MUST carry
# `reason`, `source` and `verified_on`. Curated values win over source values
# and every override is listed in build-report.json (never silent).
#
# Supported sections (see tools/data_pipeline/lib/src/overlay.dart):
#   release:         {patch: 0}                     # dataset_version YYYY.MM.<patch>
#   operators:       [{osm_operator, id, name_hi?, reason, source, verified_on}]
#   lines:           [{id, name_en?, name_hi?, short_name?, color?, reason, source, verified_on}]
#   stations:        [{id, name_en?, name_hi?, lat?, lng?, aliases?: [{text, lang, kind}], reason, source, verified_on}]
#   station_merges:  [{id, members: [<cluster ids from the report>], reason, source, verified_on}]
#   resolutions:     [{conflict: <conflict id>, accept: true | use: osm|wikidata|<value>, reason, source, verified_on}]
#
# RESERVED for later milestones (rejected if present): gates, platforms,
# facilities, accessibility, parking, fares, timings.

